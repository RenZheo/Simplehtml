<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>資源分享</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #111111;
      --muted: #555555;
      --line: #d9d9d9;
      --surface: #f6f6f6;
      --surface-2: #ffffff;
      --accent: #111111;
    }

    :root[data-theme="dark"] {
      --bg: #0f0f10;
      --fg: #f5f5f5;
      --muted: #c9c9c9;
      --line: #303033;
      --surface: #1a1a1c;
      --surface-2: #141416;
      --accent: #f5f5f5;
    }

    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--fg);
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 1rem;
    }

    .page-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: start;
      margin-bottom: 1rem;
      padding-bottom: 0.8rem;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0 0 0.45rem;
      font-size: clamp(1.4rem, 3vw, 2rem);
      letter-spacing: 0.03em;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.35rem;
      height: 2.35rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--fg);
      text-decoration: none;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .home-btn:hover {
      background: var(--surface-2);
    }

    .resource-list {
      display: grid;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface-2);
    }

    .resource-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 0.8rem;
      align-items: center;
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--line);
    }

    .resource-item:last-child {
      border-bottom: 0;
    }

    .resource-name {
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .resource-desc {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.55;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.25rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 0.85rem;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .download-btn:hover {
      opacity: 0.86;
    }

    .empty {
      padding: 0.9rem 1rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .container {
        padding: 0.8rem;
      }

      .resource-item {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .download-btn {
        width: fit-content;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="page-head">
      <div>
        <h1>資源分享</h1>
        <p class="sub">這裡會讀取 resources.json。新增檔案時，把檔案放進 downloads 資料夾，再到 JSON 新增一筆資料即可。</p>
      </div>
      <a class="home-btn" href="index.html" aria-label="返回主頁">⌂</a>
    </header>

    <section class="resource-list" id="resourceList" aria-label="資源清單">
      <p class="empty">資源載入中...</p>
    </section>
  </main>

  <script>
    const RESOURCES_PATH = "./resources.json";
    const resourceList = document.getElementById("resourceList");

    function initTheme() {
      const saved = localStorage.getItem("enchantTheme") || "auto";
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved === "auto" ? (prefersDark ? "dark" : "light") : saved);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(text) {
      return String(text).replaceAll("&", "&amp;").replaceAll('"', "&quot;");
    }

    function renderResources(resources) {
      resourceList.innerHTML = "";

      if (!Array.isArray(resources) || resources.length === 0) {
        resourceList.innerHTML = '<p class="empty">尚未新增資源。</p>';
        return;
      }

      for (const resource of resources) {
        const name = String(resource.name ?? "").trim();
        const description = String(resource.description ?? "").trim();
        const file = String(resource.file ?? "").trim();
        if (!name || !file) continue;

        const item = document.createElement("article");
        item.className = "resource-item";
        item.innerHTML = `
          <div>
            <div class="resource-name">${escapeHtml(name)}</div>
            <div class="resource-desc">${escapeHtml(description || "沒有描述")}</div>
          </div>
          <a class="download-btn" href="${escapeAttr(file)}" download>下載</a>
        `;
        resourceList.appendChild(item);
      }

      if (!resourceList.children.length) {
        resourceList.innerHTML = '<p class="empty">尚未新增可下載的資源。</p>';
      }
    }

    async function loadResources() {
      try {
        const resp = await fetch(RESOURCES_PATH, { cache: "no-store" });
        if (!resp.ok) throw new Error(`無法載入資源清單：${resp.status}`);
        renderResources(await resp.json());
      } catch {
        resourceList.innerHTML = '<p class="empty">尚未建立資源清單，或目前無法載入。</p>';
      }
    }

    initTheme();
    loadResources();
  </script>
</body>
</html>
